name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Test builds on demand from any branch (Actions > Build > Run workflow). They are never signed.
  # Versioned 0.0.<run> (which the installer refuses to put over an installed release) unless a
  # version is given, e.g. 1.2.0 for a pre-release to install over 1.1.x.
  workflow_dispatch:
    inputs:
      version:
        description: "Version for this test build (x.y.z). Empty: 0.0.<run>"
        type: string
        default: ""
      sign:
        description: "Sign the MSIX with a self-signed certificate for sideload testing (also uploads the .cer)"
        type: boolean
        default: true

# Least privilege: jobs ask for more only where they need it (OIDC for signing, write to publish the
# GitHub release).
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    # A hung build must not hold a runner for hours (the default limit is six).
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } elseif ($env:INPUT_VERSION -match '^\d+\.\d+\.\d+$') {
            $version = $env:INPUT_VERSION
          } else {
            $version = "0.0.${{ github.run_number }}"
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Version $version"

      # A release needs its description (docs/releases/<tag>.md). Checked first, so a tag without
      # one fails here instead of after the signing approval.
      - name: Release notes present
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $notes = "docs/releases/${{ github.ref_name }}.md"
          if (-not (Test-Path $notes) -or -not (Get-Content $notes -Raw).Trim()) {
            throw "Missing $notes. Write the release description (what NoteMode is, what changed, downloads) and tag again. See docs/releases/README.md."
          }
          Write-Host "Release notes: $notes"

      - name: Restore
        run: dotnet restore src/NoteMode.sln

      - name: Build
        run: dotnet build src/NoteMode.sln --configuration Release --no-restore -p:Version=${{ env.APP_VERSION }}

      # Native AOT: one self-contained native executable, no .NET runtime needed on the target.
      # Needs the C++ build tools that ship with Visual Studio on the hosted Windows image. Release and
      # manual runs publish (and maybe sign) their own in the release job.
      - name: Publish (Native AOT)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch' }}
        run: >
          dotnet publish src/NoteMode
          --configuration Release
          --runtime win-x64
          --output publish
          -p:Version=${{ env.APP_VERSION }}

      - name: Drop debug symbols from the publish folder
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch' }}
        shell: pwsh
        run: Get-ChildItem publish -Filter *.pdb | Remove-Item

      - name: Upload build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: NoteMode-win-x64
          path: publish/

  # Tag builds and manual runs: installers, Store package and (tags only) code signing.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    # Azure only trusts jobs running in the 'release' environment (the subject of the federated
    # credential), and that environment only admits v* tags and needs a reviewer's approval, so
    # nothing but a reviewed release tag can be signed. Manual runs use no environment: unsigned.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    permissions:
      contents: read
      # Signs in to Azure without a stored secret (OIDC) for code signing.
      id-token: write

    # Code signing (Azure Trusted Signing) switches itself on once these exist; until then every
    # signing step is skipped and the outputs are unsigned.
    #   secrets:   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID  (app registration with a
    #              federated credential for this repo's 'release' environment and the "Trusted Signing
    #              Certificate Profile Signer" role on the certificate profile)
    #   variables: SIGNING_ENDPOINT (e.g. https://eus.codesigning.azure.net/), SIGNING_ACCOUNT,
    #              SIGNING_PROFILE (the certificate profile; set last, it is what turns signing on)
    env:
      SIGN: ${{ secrets.AZURE_CLIENT_ID != '' && vars.SIGNING_ACCOUNT != '' && vars.SIGNING_PROFILE != '' && startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # One version for everything: the assembly (shown in Settings > About), the release zip, the
      # installers and the MSIX manifest. Tags use the tag; manual runs get their version input or 0.0.<run>.
      - name: Version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } elseif ($env:INPUT_VERSION -match '^\d+\.\d+\.\d+$') {
            $version = $env:INPUT_VERSION
          } else {
            $version = "0.0.${{ github.run_number }}"
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Version $version"

      - name: Publish (Native AOT)
        run: >
          dotnet publish src/NoteMode
          --configuration Release
          --runtime win-x64
          --output publish
          -p:Version=${{ env.APP_VERSION }}

      - name: Drop debug symbols from the publish folder
        shell: pwsh
        run: Get-ChildItem publish -Filter *.pdb | Remove-Item

      - name: Publish installer binaries
        shell: pwsh
        run: ./packaging/Build-Installer.ps1 -Stage Publish -Version "${{ env.APP_VERSION }}"

      # Third-party actions are pinned to a commit (tag in the comment) so a moved tag cannot change
      # what runs with the signing identity.
      - name: Azure login (code signing)
        if: env.SIGN == 'true'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Sign what ends up on users' disks before it is zipped or packed into an installer. The MSIX is
      # left alone: the Store signs it.
      - name: Sign the release zip contents
        if: env.SIGN == 'true'
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0.5.11
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: publish
          files-folder-filter: exe,dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign the installer binaries
        if: env.SIGN == 'true'
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0.5.11
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: artifacts/installer-stage
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: NoteMode-win-x64
          path: publish/

      # Tag builds produce the unsigned package for Partner Center (the Store signs it).
      # Manual runs produce a test package: signed with a throwaway certificate when "sign" is set,
      # versioned 0.0.<run>.0 (or <version input>.0) for sideloading, not for the Store.
      - name: Build Store package (MSIX)
        shell: pwsh
        env:
          STORE_PACKAGE_NAME: ${{ secrets.STORE_PACKAGE_NAME }}
          STORE_PUBLISHER: ${{ secrets.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY: ${{ secrets.STORE_PUBLISHER_DISPLAY }}
        run: |
          $sign = "${{ github.event.inputs.sign }}" -eq "true" -and "${{ github.event_name }}" -eq "workflow_dispatch"
          ./packaging/Build-Msix.ps1 -Version "${{ env.APP_VERSION }}.0" -Output artifacts -Sign:$sign

      - name: Upload Store package
        uses: actions/upload-artifact@v4
        with:
          name: NoteMode-msix
          path: |
            artifacts/*.msix
            artifacts/*.cer

      # Direct-download installer (Inno Setup), built from the binaries signed above.
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          ./packaging/Build-Installer.ps1 -Stage Compile -Version "${{ env.APP_VERSION }}" -Output artifacts

      - name: Sign the installer
        if: env.SIGN == 'true'
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0.5.11
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: artifacts
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # After signing, so the published hashes match the files people download.
      - name: Hash the installer
        shell: pwsh
        run: |
          $lines = Get-ChildItem artifacts -Filter "NoteMode-Setup-*.exe" | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          $lines
          # LF endings, or "sha256sum -c" on Linux/macOS reads the file names with a trailing CR.
          [System.IO.File]::WriteAllText("$PWD/artifacts/SHA256SUMS.txt", (($lines -join "`n") + "`n"))

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NoteMode-installer
          path: |
            artifacts/NoteMode-Setup-*.exe
            artifacts/SHA256SUMS.txt

      - name: Package release zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath "NoteMode-${{ github.ref_name }}-win-x64.zip"

      - name: Upload release zip
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: NoteMode-release-zip
          path: NoteMode-${{ github.ref_name }}-win-x64.zip

  # Installs, upgrades and uninstalls the installer just built on a clean runner.
  installer-smoke:
    needs: release
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: NoteMode-installer
          path: installers

      - name: Install, check, upgrade, uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem installers -Filter "NoteMode-Setup-*.exe" | Select-Object -First 1
          if (-not $setup) { throw "No installer was built." }
          ./packaging/Test-Installer.ps1 -Installer $setup.FullName -LogDir "$env:RUNNER_TEMP/notemode-installer-logs"

      - name: Upload setup logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-smoke-logs
          path: ${{ runner.temp }}/notemode-installer-logs/

  # Only this job can write to the repository, and only for a tag whose installer passed the smoke test.
  github-release:
    needs: [release, installer-smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Only the release description is needed from the repository.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/releases
          path: repo

      - uses: actions/download-artifact@v4
        with:
          name: NoteMode-installer
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: NoteMode-release-zip
          path: .

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            NoteMode-${{ github.ref_name }}-win-x64.zip
            artifacts/NoteMode-Setup-*.exe
            artifacts/SHA256SUMS.txt
          name: NoteMode ${{ github.ref_name }}
          # The written description, followed by GitHub's "Full Changelog" link.
          body_path: repo/docs/releases/${{ github.ref_name }}.md
          generate_release_notes: true
